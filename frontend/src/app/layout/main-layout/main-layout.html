<div class="app-container">
  <app-navbar (sidebarToggle)="toggleSidebar()"></app-navbar>

  <div class="app-layout">
    <app-sidebar
      [isOpen]="sidebarOpen"
      (sidebarClose)="closeSidebar()"
      (categorySelect)="selectCategory($event)"
    >
    </app-sidebar>

    <main class="main-content" [class.sidebar-open]="sidebarOpen">
      <div class="content-wrapper">
        <div class="hero-section">
          <div class="hero-content">
            <h1 class="hero-title">🍃 Welcome to the Ultimate Ninja Library</h1>
            <p class="hero-subtitle">
              Discover your next adventure in our vast collection of manga, light novels, and anime
              merchandise!
            </p>
            <button class="btn btn-primary hero-cta">⚡ Start Your Journey</button>
          </div>
          <div class="hero-stats">
            <div class="stat">
              <div class="stat-number">1,500+</div>
              <div class="stat-label">Books Available</div>
            </div>
            <div class="stat">
              <div class="stat-number">50+</div>
              <div class="stat-label">Series Collections</div>
            </div>
            <div class="stat">
              <div class="stat-number">24/7</div>
              <div class="stat-label">Customer Support</div>
            </div>
          </div>
        </div>

        <!-- <app-book-grid [selectedCategory]="selectedCategory"></app-book-grid> -->
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <!-- <app-footer></app-footer> -->
</div>
